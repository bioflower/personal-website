name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
   name: Quality checks
   runs-on: ubuntu-latest
   
   steps:
    - name: Check out repository
      uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm test
    
    - name: Build application
      run: npm run build
